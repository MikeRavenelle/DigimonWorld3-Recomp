name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No game data is available here, so the recompiled game and the in-game scenarios are not built or run: the program is
# built without game code, the way it is released (the player's setup builds the game module from their own disc). The
# jobs build the tools, the runtime and the renderer, and run the unit tests (the ones that need a disc skip themselves).

jobs:
  linux:
    name: Linux x64 build and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld cmake ninja-build glslang-tools spirv-tools \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev \
            libxkbcommon-dev libwayland-dev libasound2-dev libpulse-dev libudev-dev libdrm-dev libgbm-dev \
            libegl-dev libvulkan-dev

      - name: Configure
        run: cmake --preset linux-x64-debug

      - name: Build
        run: cmake --build --preset linux-x64-debug

      # No Vulkan driver is installed on the runner, so the GPU renderer tests skip themselves; the software
      # rasterizer and everything else runs.
      - name: Unit tests
        run: ctest --preset linux-x64-debug -LE scenario -j4

  linux-arm64:
    name: Linux arm64 build and unit tests
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld cmake ninja-build glslang-tools spirv-tools \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev \
            libxkbcommon-dev libwayland-dev libasound2-dev libpulse-dev libudev-dev libdrm-dev libgbm-dev \
            libegl-dev libvulkan-dev

      - name: Configure
        run: cmake --preset linux-arm64-debug

      - name: Build
        run: cmake --build --preset linux-arm64-debug

      - name: Unit tests
        run: ctest --preset linux-arm64-debug -LE scenario -j4

  macos-arm64:
    name: macOS arm64 build and unit tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: brew install cmake ninja glslang sdl3 spirv-tools

      - name: Configure
        run: cmake --preset macos-arm64-debug

      - name: Build
        run: cmake --build --preset macos-arm64-debug

      # The renderer tests run on Metal when the runner exposes a device and skip themselves otherwise.
      - name: Unit tests
        run: ctest --preset macos-arm64-debug -LE scenario -j4

  windows:
    name: Windows x64 native build and unit tests
    runs-on: windows-latest
    env:
      GLSLANG_VERSION: 16.6.0
    steps:
      - uses: actions/checkout@v4

      # clang-cl links against the MSVC libraries and the Windows SDK, so the developer environment is needed. It also
      # puts the Ninja that ships with Visual Studio on the PATH.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Fetch glslang
        shell: pwsh
        run: |
          $dir = "$env:GITHUB_WORKSPACE\.tools\glslang"
          Invoke-WebRequest "https://github.com/KhronosGroup/glslang/releases/download/$env:GLSLANG_VERSION/glslang-$env:GLSLANG_VERSION-windows-x86_64-release.zip" -OutFile "$env:RUNNER_TEMP\glslang.zip"
          Expand-Archive "$env:RUNNER_TEMP\glslang.zip" -DestinationPath $dir
          "$dir\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure
        run: cmake --preset windows-x64-release

      - name: Build
        run: cmake --build --preset windows-x64-release

      # The runner has no GPU and the renderer does not use software adapters, so the GPU cases in test_render skip
      # themselves; everything else in it runs.
      - name: Unit tests
        run: ctest --preset windows-x64-release -LE scenario -j4

      - name: Check the package contents
        shell: bash
        run: |
          cmake --install build/windows-x64-release --component app --prefix "$RUNNER_TEMP/stage"
          find "$RUNNER_TEMP/stage" -type f | sort
          test -f "$RUNNER_TEMP/stage/dw3recomp.exe"
          test -f "$RUNNER_TEMP/stage/toolchain/include/dw3/recomp.h"
          test -f "$RUNNER_TEMP/stage/toolchain/module/module_entry.c"
          test "$(find "$RUNNER_TEMP/stage" -type f | wc -l)" -eq 5
