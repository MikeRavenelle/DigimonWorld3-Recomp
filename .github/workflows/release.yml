name: Release

# Runs when a version tag is pushed (v0.1.0-beta, ...). Builds the program for every platform without any game code and
# publishes the packages as a GitHub pre-release. A package holds the program, the toolchain the setup uses to build the
# game from the player's own disc, and the licence. It never contains game data.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  ZIG_VERSION: 0.17.0

jobs:
  linux-x64:
    name: Package Linux x64
    runs-on: ubuntu-24.04
    env:
      ZIG_ARCHIVE: zig-x86_64-linux-0.17.0.tar.xz
      ZIG_SHA256: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
    steps:
      - uses: actions/checkout@v4
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld cmake ninja-build glslang-tools spirv-tools \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev \
            libxkbcommon-dev libwayland-dev libasound2-dev libpulse-dev libudev-dev libdrm-dev libgbm-dev \
            libegl-dev libvulkan-dev
      - name: Fetch zig
        run: |
          curl -fsSL "https://ziglang.org/download/$ZIG_VERSION/$ZIG_ARCHIVE" -o "$RUNNER_TEMP/zig.tar.xz"
          echo "$ZIG_SHA256  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/zig" && tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
      - name: Build
        run: |
          cmake --preset linux-x64-release -DDW3_ZIG_DIR="$RUNNER_TEMP/zig"
          cmake --build --preset linux-x64-release
      - name: Unit tests
        run: ctest --preset linux-x64-release -LE scenario -j4
      - name: Package
        run: |
          cmake --install build/linux-x64-release --component app --prefix "$RUNNER_TEMP/stage"
          tar -C "$RUNNER_TEMP/stage" -czf "DW3Recomp-${GITHUB_REF_NAME}-linux-x64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: DW3Recomp-*.tar.gz

  linux-arm64:
    name: Package Linux arm64
    runs-on: ubuntu-24.04-arm
    env:
      ZIG_ARCHIVE: zig-aarch64-linux-0.17.0.tar.xz
      ZIG_SHA256: 9e8d11661d4ae3bd57702a3832781e23ad151dde5798e16a5ccd503f65234ff8
    steps:
      - uses: actions/checkout@v4
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld cmake ninja-build glslang-tools spirv-tools \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev \
            libxkbcommon-dev libwayland-dev libasound2-dev libpulse-dev libudev-dev libdrm-dev libgbm-dev \
            libegl-dev libvulkan-dev
      - name: Fetch zig
        run: |
          curl -fsSL "https://ziglang.org/download/$ZIG_VERSION/$ZIG_ARCHIVE" -o "$RUNNER_TEMP/zig.tar.xz"
          echo "$ZIG_SHA256  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/zig" && tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
      - name: Build
        run: |
          cmake --preset linux-arm64-release -DDW3_ZIG_DIR="$RUNNER_TEMP/zig"
          cmake --build --preset linux-arm64-release
      - name: Unit tests
        run: ctest --preset linux-arm64-release -LE scenario -j4
      - name: Package
        run: |
          cmake --install build/linux-arm64-release --component app --prefix "$RUNNER_TEMP/stage"
          tar -C "$RUNNER_TEMP/stage" -czf "DW3Recomp-${GITHUB_REF_NAME}-linux-arm64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: DW3Recomp-*.tar.gz

  macos-arm64:
    name: Package macOS arm64
    runs-on: macos-14
    env:
      ZIG_ARCHIVE: zig-aarch64-macos-0.17.0.tar.xz
      ZIG_SHA256: b607e9b9234790a008116ae5bdb71c6243b84b9fb42a53a9e70fde41c06c536a
    steps:
      - uses: actions/checkout@v4
      - name: Install packages
        run: brew install cmake ninja glslang sdl3 spirv-tools
      - name: Fetch zig
        run: |
          curl -fsSL "https://ziglang.org/download/$ZIG_VERSION/$ZIG_ARCHIVE" -o "$RUNNER_TEMP/zig.tar.xz"
          echo "$ZIG_SHA256  $RUNNER_TEMP/zig.tar.xz" | shasum -a 256 -c -
          mkdir "$RUNNER_TEMP/zig" && tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
      - name: Build
        run: |
          cmake --preset macos-arm64-release -DDW3_ZIG_DIR="$RUNNER_TEMP/zig"
          cmake --build --preset macos-arm64-release
      - name: Unit tests
        run: ctest --preset macos-arm64-release -LE scenario -j4
      # Not signed or notarized yet: see packaging/macos/README.md.
      - name: Package
        run: |
          cmake --install build/macos-arm64-release --component app --prefix "$RUNNER_TEMP/stage"
          tar -C "$RUNNER_TEMP/stage" -czf "DW3Recomp-${GITHUB_REF_NAME}-macos-arm64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: DW3Recomp-*.tar.gz

  windows-x64:
    name: Package Windows x64
    runs-on: windows-latest
    env:
      GLSLANG_VERSION: 16.6.0
      ZIG_ARCHIVE: zig-x86_64-windows-0.17.0.zip
      ZIG_SHA256: b5663f69581dcf391293fbf16c06cb80d81d806545ce618b4d0bab7f0eb8c428
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Fetch glslang
        shell: pwsh
        run: |
          $dir = "$env:GITHUB_WORKSPACE\.tools\glslang"
          Invoke-WebRequest "https://github.com/KhronosGroup/glslang/releases/download/$env:GLSLANG_VERSION/glslang-$env:GLSLANG_VERSION-windows-x86_64-release.zip" -OutFile "$env:RUNNER_TEMP\glslang.zip"
          Expand-Archive "$env:RUNNER_TEMP\glslang.zip" -DestinationPath $dir
          "$dir\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Fetch zig
        shell: pwsh
        run: |
          Invoke-WebRequest "https://ziglang.org/download/$env:ZIG_VERSION/$env:ZIG_ARCHIVE" -OutFile "$env:RUNNER_TEMP\zig.zip"
          if ((Get-FileHash "$env:RUNNER_TEMP\zig.zip" -Algorithm SHA256).Hash.ToLower() -ne $env:ZIG_SHA256) { throw "zig checksum mismatch" }
          Expand-Archive "$env:RUNNER_TEMP\zig.zip" -DestinationPath "$env:RUNNER_TEMP\zig-unpacked"
          $inner = (Get-ChildItem "$env:RUNNER_TEMP\zig-unpacked")[0].FullName
          Move-Item $inner "$env:RUNNER_TEMP\zig"
      - name: Build
        shell: bash
        run: |
          cmake --preset windows-x64-release -DDW3_ZIG_DIR="$RUNNER_TEMP/zig"
          cmake --build --preset windows-x64-release
      - name: Unit tests
        run: ctest --preset windows-x64-release -LE scenario -j4
      - name: Package
        shell: pwsh
        run: |
          cmake --install build/windows-x64-release --component app --prefix "$env:RUNNER_TEMP\stage"
          Compress-Archive -Path "$env:RUNNER_TEMP\stage\*" -DestinationPath "DW3Recomp-$env:GITHUB_REF_NAME-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: DW3Recomp-*.zip

  publish:
    name: Publish pre-release
    needs: [linux-x64, linux-arm64, macos-arm64, windows-x64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" packages/* --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "$GITHUB_REF_NAME" --generate-notes
