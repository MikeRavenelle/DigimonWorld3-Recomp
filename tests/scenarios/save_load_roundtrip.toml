name = "save_load_roundtrip"
description = "New Game, walk to the Asuka Inn save officer, save to slot 1, power-cycle keeping the card, Continue, load slot 1 and resume in the Inn."
frames = 58000
memcard = "blank"

# New Game: the opening scenes are skipped with CROSS taps and the story scenes up to the first free
# movement (partner Digimon from the Main Lobby, tutorial battle) are clicked through. The scripted walk then
