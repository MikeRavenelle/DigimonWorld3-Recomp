name = "god_mode"
description = "With god mode on, the first hit defeats the first random encounter's enemy and the party's HP stays full through the battle."
start_state = "new_game.state"   # written by new_game_state.toml
start_frame = 1473
frames = 2400
memcard = "blank"
settings = ["gameplay.god_mode=true"]

# The start state is New Game up to Asuka City Central Sector (new_game_state.toml plays the shared prefix
# common/new_game.toml, which documents the RAM words used below). From there the script is driven by RAM:
#
#   map id    0x800554D4 (word): 0x1C3 Asuka City Central Sector, 0x1C4 Asuka Bridge (gate chamber), 0x1D2
#                                Central Park (field), 0x1FA battle arena
#   game mode 0x800554D0 (word): 2 field, 5/0xE scene transition, 6 battle, 0x14 battle results
#   enemy HP  0x800A3260 (half): current HP of the first enemy (max HP at 0x800A325E); 0 once it is defeated
#
# Walking onto the red exit arrow of a map edge needs CROSS to take the exit.

# Central Sector: along the street (same legs as save_load_roundtrip.toml) to the exit arrow at the city gate.
[[walk]]
at = 1474
label = "to the gate 1"
x = { via = 0x8004ADC0, addr = 0x58, size = 4 }
z = { via = 0x8004ADC0, addr = 0x5C, size = 4 }
target = [819, 521]
tolerance = 10
axes = "x"
timeout = 900
guard = [{ addr = 0x800554D4, size = 4, value = 0x1C3 }]

