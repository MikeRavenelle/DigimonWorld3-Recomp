# Same encounter as field_battle.toml. Without god mode its enemy (120 HP) survives the first hit and the party loses
# HP; here the enemy's HP (max at 0x800A325E, current at 0x800A3260) reaches 0 within 700 frames of the encounter,
# before the first hit would even have landed, and the first party member's HP (0x800A3200, max 0x800A31FE) is full.
[[wait]]
at = 1804
label = "random encounter"
ram = [{ addr = 0x800554D0, size = 4, value = 6 }]
timeout = 4000
hold = ["LEFT"]

[[wait]]
at = 1809
label = "enemy defeated by the first hit"
ram = [{ addr = 0x800A325E, size = 2, value = 0, cmp = "gt" }, { addr = 0x800A3260, size = 2, value = 0 }]
timeout = 700
press = "CROSS"
every = 45
press_hold = 3

[[wait]]
at = 1815
label = "battle won"
ram = [{ addr = 0x800554D0, size = 4, value = 20 }]
timeout = 2000
press = "CROSS"
every = 45
press_hold = 3

[[check]]
at = 1820
label = "party at full HP"
ram = [{ addr = 0x800A3200, size = 2, value = 150 }, { addr = 0x800A31FE, size = 2, value = 150 }]
screenshot = true
