name = "widescreen_field"
description = "Walk along the street of Asuka City Central Sector with widescreen fields at 16:9 on a headless GPU renderer: the margins beside the 4:3 area show the map, the characters that stand in a margin are drawn, and the screens whose map is not known stay 4:3."
start_state = "new_game.state"   # written by new_game_state.toml
start_frame = 1473
frames = 1560
memcard = "blank"
settings = ["graphics.widescreen=16:9"]
include = ["common/asuka_street.toml"]

# The start state shows the map's name card for the first frames of a map: not a map the renderer can work out yet, so the
# 4:3 picture with borders, and no character has reached a margin yet.
[[check]]
at = 1473
label = "name card"
display_enabled = true
margin_colors_max = 1
wide_margin_polygons_max = 0

# The street, with the walk finished: the map continues in both margins (the colours counted lie in the outer tenth of
# the picture), Patamon and Kotemon among them (polygons of the game's own sprites in the margins).
[[check]]
at = 1480
label = "street"
display_enabled = true
ram = [{ addr = 0x800554D0, size = 4, value = 2 }]
margin_colors_min = 16
wide_field_frames_min = 100
wide_margin_polygons_min = 1
screenshot = true
