name = "widescreen_field_ui"
description = "Widescreen fields at 16:9 with the field START menu and its settings screen open: the windows stay in the 4:3 area while the map continues in the margins, and the field goes on afterwards."
start_state = "new_game.state"   # written by new_game_state.toml
start_frame = 1473
frames = 2000
memcard = "blank"
settings = ["graphics.widescreen=16:9"]

# RAM words as in ingame_settings.toml: the menu list is the task object at 0x800AB6F4 (+0x0C state 1 running), the settings
# screen sets the marker 0x53455453 at 0x800AB760 while it is open, and its first row text is at the pointer 0x800ABA34.

[[press]]
button = "START"
at = 1720

[[wait]]
at = 1730
label = "menu rows drawn"
ram = [{ via = 0x800ABA34, addr = 0, size = 1, value = 0x16 }]
timeout = 600

[[check]]
at = 1745
label = "START menu"
ram = [{ addr = 0x800554D0, size = 4, value = 2 }, { addr = 0x800AB700, size = 4, value = 1 }]
margin_colors_min = 16
wide_field_frames_min = 100
screenshot = true

[[wait]]
at = 1750
label = "settings open"
press = "SELECT"
every = 40
ram = [{ addr = 0x800AB760, size = 4, value = 0x53455453 }, { via = 0x800ABA34, addr = 0, size = 1, value = 0x1D }]
timeout = 300

[[check]]
at = 1765
label = "settings screen"
ram = [{ addr = 0x800AB760, size = 4, value = 0x53455453 }]
margin_colors_min = 16
screenshot = true

[[wait]]
at = 1770
label = "back in the menu"
press = "CIRCLE"
every = 40
ram = [{ addr = 0x800AB760, size = 4, value = 0x53455453, cmp = "ne" }]
timeout = 300

[[wait]]
at = 1780
label = "menu closed"
press = "TRIANGLE"
every = 60
ram = [{ addr = 0x800AB700, size = 4, value = 1, cmp = "ne" }]
timeout = 600

[[check]]
at = 1800
label = "field again"
ram = [{ addr = 0x800554D0, size = 4, value = 2 }]
margin_colors_min = 16
screenshot = true
