# Shared leg of the late-game scenarios: from endgame.state (Amaterasu Inn 1F) through the Underground Path to the east half of
# Amaterasu Central Sector, ending on the wait for the field after the map change. Script frames 1310..2010.
#
# Map ids (word 0x800554D4): 0x270 Amaterasu Inn 1F, 0x291 Underground Path, 0x1FE Amaterasu City Central Sector.
# Game mode 0x800554D0: 2 field. The event flag 0x80099114 is 1 while a map title or a scripted event runs.
#
# The d-pad is turned against the map axes and a diagonal needs its two buttons pressed together, so the legs are timed
# presses recorded from the state (the state makes them exact); every map change ends on a RAM wait. CROSS is tapped
# on the last leg of a hop to take the door arrow.

# Inn 1F: down the stairs to the basement door.
[[press]]
button = "LEFT"
at = 1310
hold = 100

[[press]]
button = "DOWN"
at = 1412
hold = 60

[[press]]
button = "RIGHT"
at = 1412
hold = 60

[[repeat]]
button = "CROSS"
from = 1412
to = 1472
every = 10

[[press]]
button = "DOWN"
at = 1474
hold = 80

[[press]]
button = "LEFT"
at = 1474
hold = 80

[[repeat]]
button = "CROSS"
from = 1474
to = 1554
every = 10

[[press]]
button = "DOWN"
at = 1556
hold = 40

[[press]]
button = "LEFT"
at = 1556
hold = 40

[[repeat]]
button = "CROSS"
from = 1556
to = 1596
every = 10

[[press]]
button = "DOWN"
at = 1598
hold = 40

[[repeat]]
button = "CROSS"
from = 1598
to = 1638
every = 10

[[press]]
button = "DOWN"
at = 1640
hold = 80

[[press]]
button = "RIGHT"
at = 1640
hold = 80

[[repeat]]
button = "CROSS"
from = 1640
to = 1720
every = 10

[[wait]]
at = 1722
label = "Underground Path"
ram = [{ addr = 0x800554D4, size = 4, value = 0x291 }, { addr = 0x800554D0, size = 4, value = 2 },
       { via = 0x8004ADC0, addr = 0x58, size = 4, value = 0, cmp = "ne" }]
timeout = 900
press = "CROSS"
every = 10
press_hold = 3

# The map title fades out and the player gets control (the event flag at 0x80099114 drops).
[[wait]]
at = 1724
label = "Underground Path settled"
ram = [{ addr = 0x80099114, size = 4, value = 0 }]
timeout = 900

# Underground Path: along the tunnel to the exit.
[[press]]
button = "DOWN"
at = 1824
hold = 100

[[press]]
button = "DOWN"
at = 1926
hold = 80

[[repeat]]
button = "CROSS"
from = 1926
to = 2006
every = 10

[[wait]]
at = 2008
label = "Central Sector"
ram = [{ addr = 0x800554D4, size = 4, value = 0x1FE }, { addr = 0x800554D0, size = 4, value = 2 },
       { via = 0x8004ADC0, addr = 0x58, size = 4, value = 0, cmp = "ne" }]
timeout = 900
press = "CROSS"
every = 10
press_hold = 3

[[wait]]
at = 2010
label = "Central Sector settled"
ram = [{ addr = 0x80099114, size = 4, value = 0 }]
timeout = 900
