# From the start state of new_game_state.toml (Asuka City Central Sector, the player in control): out through the city gate
# and the Asuka Bridge into Central Park, to the training gym at the top of the park, a session of Punch training with
# Leomon, and back out into the park. RAM words as documented in new_game.toml.
#
#   training points  0x80048C6E (half): none at the start of a new game, so a [[poke]] gives the party 50
#   game mode        0x800554D0: 0xA is the training overlay (STGTRAIN)
#
# The training screens wait on CROSS: the session is steered by taps, and TRIANGLE backs out of the menus.

[[walk]]
at = 1474
label = "to the gate 1"
x = { via = 0x8004ADC0, addr = 0x58, size = 4 }
z = { via = 0x8004ADC0, addr = 0x5C, size = 4 }
target = [819, 521]
tolerance = 10
axes = "x"
timeout = 900
guard = [{ addr = 0x800554D4, size = 4, value = 0x1C3 }]

[[walk]]
at = 1475
label = "to the gate 2"
x = { via = 0x8004ADC0, addr = 0x58, size = 4 }
z = { via = 0x8004ADC0, addr = 0x5C, size = 4 }
target = [801, 482]
tolerance = 10
axes = "z"
timeout = 900
guard = [{ addr = 0x800554D4, size = 4, value = 0x1C3 }]

