timeout = 900
guard = [{ addr = 0x800554D4, size = 4, value = 0x1C3 }]

[[walk]]
at = 1478
label = "to the gate 5"
x = { via = 0x8004ADC0, addr = 0x58, size = 4 }
z = { via = 0x8004ADC0, addr = 0x5C, size = 4 }
target = [253, 531]
tolerance = 10
axes = "z"
timeout = 900
guard = [{ addr = 0x800554D4, size = 4, value = 0x1C3 }]

[[walk]]
at = 1479
label = "to the gate 6"
x = { via = 0x8004ADC0, addr = 0x58, size = 4 }
z = { via = 0x8004ADC0, addr = 0x5C, size = 4 }
target = [257, 749]
tolerance = 10
axes = "z"
