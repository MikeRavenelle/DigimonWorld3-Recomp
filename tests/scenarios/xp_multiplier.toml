name = "xp_multiplier"
description = "The field_battle encounter won with the XP multiplier at 2x: the lead Digimon gains twice the experience it gains at 1x (6 points)."
start_state = "new_game.state"   # written by new_game_state.toml
start_frame = 1473
frames = 2964
memcard = "blank"
settings = ["gameplay.xp_multiplier=2x"]

# The results screen prints the share it grants: the task of the results screen (0x800AAAB4) keeps it at +0x64, so the
# word at 0x800AAB18 holds the 12 points shown as "12 EXP" while the lead's experience still reads 4 (the grant runs later).
#
# The lead Digimon's record starts at 0x80048C50: experience (word) at +0x18, level (half) at +0x1C. It holds 4 before the
# fight; the encounter awards 6, so 1x leaves 10 (field_battle.toml checks that) and 2x leaves 16.
#
# The start state is New Game up to Asuka City Central Sector (new_game_state.toml plays the shared prefix
# common/new_game.toml, which documents the RAM words used below). From there the script is driven by RAM:
#
#   map id    0x800554D4 (word): 0x1C3 Asuka City Central Sector, 0x1C4 Asuka Bridge (gate chamber), 0x1D2
#                                Central Park (field), 0x1FA battle arena
#   game mode 0x800554D0 (word): 2 field, 5/0xE scene transition, 6 battle, 0x14 battle results
#   enemy HP  0x800A3260 (half): current HP of the first enemy (max HP at 0x800A325E); 0 once it is defeated
#
# Walking onto the red exit arrow of a map edge needs CROSS to take the exit.

# Central Sector: along the street (same legs as save_load_roundtrip.toml) to the exit arrow at the city gate.
[[walk]]
at = 1474
label = "to the gate 1"
x = { via = 0x8004ADC0, addr = 0x58, size = 4 }
z = { via = 0x8004ADC0, addr = 0x5C, size = 4 }
target = [819, 521]
tolerance = 10
axes = "x"
timeout = 900
guard = [{ addr = 0x800554D4, size = 4, value = 0x1C3 }]

[[walk]]
at = 1475
label = "to the gate 2"
x = { via = 0x8004ADC0, addr = 0x58, size = 4 }
z = { via = 0x8004ADC0, addr = 0x5C, size = 4 }
target = [801, 482]
tolerance = 10
axes = "z"
timeout = 900
guard = [{ addr = 0x800554D4, size = 4, value = 0x1C3 }]

[[walk]]
at = 1476
label = "to the gate 3"
x = { via = 0x8004ADC0, addr = 0x58, size = 4 }
z = { via = 0x8004ADC0, addr = 0x5C, size = 4 }
target = [577, 610]
tolerance = 10
timeout = 900
guard = [{ addr = 0x800554D4, size = 4, value = 0x1C3 }]

[[walk]]
at = 1477
label = "to the gate 4"
x = { via = 0x8004ADC0, addr = 0x58, size = 4 }
z = { via = 0x8004ADC0, addr = 0x5C, size = 4 }
target = [173, 595]
tolerance = 10
axes = "x"
timeout = 900
guard = [{ addr = 0x800554D4, size = 4, value = 0x1C3 }]

[[walk]]
at = 1478
label = "to the gate 5"
x = { via = 0x8004ADC0, addr = 0x58, size = 4 }
z = { via = 0x8004ADC0, addr = 0x5C, size = 4 }
target = [253, 531]
tolerance = 10
axes = "z"
timeout = 900
guard = [{ addr = 0x800554D4, size = 4, value = 0x1C3 }]

[[walk]]
at = 1479
label = "to the gate 6"
x = { via = 0x8004ADC0, addr = 0x58, size = 4 }
z = { via = 0x8004ADC0, addr = 0x5C, size = 4 }
target = [257, 749]
tolerance = 10
axes = "z"
