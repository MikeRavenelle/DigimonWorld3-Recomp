[[check]]
at = 1482
label = "Central Sector gate bridge"
display_enabled = true
screenshot = true

# CROSS on the exit arrow leads to the Asuka Bridge (0x1C4), where a second arrow at the far end leads on.
[[wait]]
at = 1486
label = "Asuka Bridge"
ram = [{ addr = 0x800554D4, size = 4, value = 0x1C4 }, { addr = 0x800554D0, size = 4, value = 2 }]
timeout = 1500
press = "CROSS"
every = 10
press_hold = 3

[[walk]]
at = 1488
label = "to the Central Park arrow"
x = { via = 0x8004ADC0, addr = 0x58, size = 4 }
z = { via = 0x8004ADC0, addr = 0x5C, size = 4 }
target = [226, 494]
tolerance = 5
timeout = 900
guard = [{ addr = 0x800554D4, size = 4, value = 0x1C4 }]

[[check]]
at = 1490
label = "Asuka Bridge"
display_enabled = true
screenshot = true

[[wait]]
at = 1494
label = "Central Park"
ram = [{ addr = 0x800554D4, size = 4, value = 0x1D2 }, { addr = 0x800554D0, size = 4, value = 2 }]
timeout = 1500
press = "CROSS"
every = 10
press_hold = 3

[[check]]
at = 1744
label = "Central Park"
display_enabled = true
screenshot = true

# In the field, holding LEFT starts a random encounter after about a thousand frames; where it happens depends on
# the frames walked, so the walk is a wait on the battle mode. In battle, CROSS picks Fight, the target and the
# attack; tapping it until the results screens appear wins against the first enemies. A further wait tapping
# CROSS leads from the results back to the field.
# Which enemy appears depends on the exact frame the walk starts. The wait starts 60 frames after the Central
# Park check (10 frames later than the natural start), which meets a Kunemon that CROSS taps defeat; other
# offsets can meet a Tapirmon that flees, leaving no results screen. Retune this offset if the prefix timing
# changes.
[[wait]]
at = 1804
label = "random encounter"
ram = [{ addr = 0x800554D0, size = 4, value = 6 }]
timeout = 4000
hold = ["LEFT"]

[[check]]
at = 1809
label = "encounter start"
display_enabled = true
ram = [{ addr = 0x800554D4, size = 4, value = 0x1FA }, { addr = 0x80048C68, size = 4, value = 4 }]
screenshot = true

[[check]]
at = 2104
label = "battle menu"
display_enabled = true
ram = [{ addr = 0x800554D0, size = 4, value = 6 }, { addr = 0x800A3260, size = 2, value = 0, cmp = "gt" }]
screenshot = true

[[wait]]
at = 2204
label = "battle won"
ram = [{ addr = 0x800554D0, size = 4, value = 20 }]
timeout = 4000
press = "CROSS"
every = 45
press_hold = 3

[[check]]
at = 2304
label = "victory"
display_enabled = true
ram = [{ addr = 0x800554D0, size = 4, value = 0x14 }, { addr = 0x800A3260, size = 2, value = 0 }, { addr = 0x800AAB18, size = 4, value = 12 }]
screenshot = true

[[wait]]
at = 2404
label = "back in the field"
ram = [{ addr = 0x800554D0, size = 4, value = 2 }, { addr = 0x800554D4, size = 4, value = 0x1D2 }]
timeout = 1500
press = "CROSS"
every = 45
press_hold = 3

[[check]]
at = 2654
label = "field after the battle"
display_enabled = true
ram = [{ addr = 0x800554D0, size = 4, value = 2 }, { addr = 0x800554D4, size = 4, value = 0x1D2 }, { addr = 0x80048C68, size = 4, value = 16 }]
screenshot = true

[[check]]
at = 2904
label = "field stays stable"
display_enabled = true
ram = [{ addr = 0x800554D0, size = 4, value = 2 }, { addr = 0x800554D4, size = 4, value = 0x1D2 }]
screenshot = true
