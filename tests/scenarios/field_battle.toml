name = "field_battle"
description = "New Game, walk out of Asuka City over the Asuka Bridge into Central Park, fight a random encounter to victory and return to the field."
frames = 41700

# The opening scenes and the story battle are clicked through exactly as in save_load_roundtrip.toml, then the
# walk to the city gate goes through Asuka City Central Sector. From there the script is driven by RAM:
#
#   map id    0x800554D4 (word): 0x1C3 Asuka City Central Sector, 0x1C4 Asuka Bridge (gate chamber), 0x1D2
#                                Central Park (field), 0x1FA battle arena
#   game mode 0x800554D0 (word): 2 field, 5/0xE scene transition, 6 battle, 0x14 battle results
#   enemy HP  0x800A3260 (half): current HP of the first enemy (max HP at 0x800A325E); 0 once it is defeated
#
# Walking onto the red exit arrow of a map edge needs CROSS to take the exit. In the field, holding LEFT starts a
# random encounter after about a thousand frames; the encounter point depends on the frames walked, so the walk
# is a wait on the battle mode instead of a fixed time. In battle, CROSS picks Fight, the target and the attack;
# tapping it until the results screens appear wins against the first enemies. A further wait tapping CROSS
# leads from the results back to the field.

press = [
    { button = "START", at = 900, hold = 4 },
    { button = "UP", at = 960, hold = 4 },
    { button = "CROSS", at = 1020, hold = 4 },
    { button = "LEFT", at = 22800, hold = 60 },
    { button = "DOWN", at = 22870, hold = 60 },
    { button = "DOWN", at = 22940, hold = 60 },
