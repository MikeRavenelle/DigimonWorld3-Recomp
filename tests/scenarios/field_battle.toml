repeat = [
    { button = "CROSS", from = 1100, to = 22800, every = 45, hold = 3 },
    { button = "CROSS", from = 23920, to = 36720, every = 40, hold = 4 },
]

[[wait]]
at = 37300
label = "Central Sector"
ram = [{ addr = 0x800554D4, size = 4, value = 0x1C3 }, { addr = 0x800554D0, size = 4, value = 2 }]
timeout = 600

[[wait]]
at = 39500
label = "Asuka Bridge"
ram = [{ addr = 0x800554D4, size = 4, value = 0x1C4 }]
timeout = 600
press = "CROSS"

[[wait]]
at = 40200
label = "Central Park"
ram = [{ addr = 0x800554D4, size = 4, value = 0x1D2 }, { addr = 0x800554D0, size = 4, value = 2 }]
timeout = 900
press = "CROSS"

[[wait]]
at = 40500
label = "random encounter"
ram = [{ addr = 0x800554D0, size = 4, value = 6 }]
timeout = 4000
hold = ["LEFT"]

[[wait]]
at = 40900
label = "battle won"
ram = [{ addr = 0x800554D0, size = 4, value = 0x14 }]
timeout = 4000
press = "CROSS"
every = 45
press_hold = 3

[[wait]]
at = 41100
label = "back in the field"
ram = [{ addr = 0x800554D0, size = 4, value = 2 }, { addr = 0x800554D4, size = 4, value = 0x1D2 }]
timeout = 1500
press = "CROSS"
every = 45
press_hold = 3

