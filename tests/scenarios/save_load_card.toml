name = "save_load_card"
description = "Title -> Continue with a blank formatted memory card inserted -> LOAD screen checks the card and reports no save file."
frames = 2100

# Selecting Slot 1 with a blank formatted card shows "Checking Memory Card. Do not touch Memory Card." while the
# game's libcard firstfile wrapper scans the kernel device table and waits for the HwCARD event; the directory
# read now completes and the game reports "Accessing Memory Card Slot 1 / File cannot be found." (no save
# data on a blank card). With no card it shows "Memory Card is not inserted." (continue_no_card).
memcard = "blank"

