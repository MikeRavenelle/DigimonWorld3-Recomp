name = "save_load_card"
description = "Title -> Continue with a blank formatted memory card inserted -> LOAD screen detects the card (no 'Memory Card is not inserted' message)."
frames = 2100

# Selecting Slot 1 with a blank formatted card shows "Checking Memory Card. Do not touch Memory Card." and the
# game stays there (progress bar never completes, verified out to frame 4000); with no card it shows
# "Memory Card is not inserted." (continue_no_card). The hashes below pin the current "card detected, check
# pending" state; update them with --record once the card check completes.
memcard = "blank"

