# CROSS on the exit arrow leads to the Asuka Bridge (0x1C4), where a second arrow at the far end leads on.
[[wait]]
at = 1486
label = "Asuka Bridge"
ram = [{ addr = 0x800554D4, size = 4, value = 0x1C4 }, { addr = 0x800554D0, size = 4, value = 2 }]
timeout = 1500
press = "CROSS"
every = 10
press_hold = 3

[[walk]]
at = 1488
label = "to the Central Park arrow"
x = { via = 0x8004ADC0, addr = 0x58, size = 4 }
z = { via = 0x8004ADC0, addr = 0x5C, size = 4 }
target = [226, 494]
tolerance = 5
timeout = 900
guard = [{ addr = 0x800554D4, size = 4, value = 0x1C4 }]

[[check]]
at = 1490
label = "Asuka Bridge"
display_enabled = true
margin_colors_min = 16
screenshot = true

[[wait]]
at = 1494
label = "Central Park"
ram = [{ addr = 0x800554D4, size = 4, value = 0x1D2 }, { addr = 0x800554D0, size = 4, value = 2 }]
timeout = 1500
press = "CROSS"
every = 10
press_hold = 3

[[check]]
at = 1744
label = "Central Park"
display_enabled = true
margin_colors_min = 16
screenshot = true

# The encounter, as in field_battle.toml. With widescreen on, the headless GPU renderer keeps a wider copy of the battle's
# frame buffers; the check renders it at 1280x720, where the outer tenth of the columns lies beside the 4:3 area
# (a black pillarbox at 4:3, see widescreen_battle_4x3.toml) and must now show the arena.
[[wait]]
at = 1804
label = "random encounter"
ram = [{ addr = 0x800554D0, size = 4, value = 6 }]
timeout = 4000
hold = ["LEFT"]

[[check]]
at = 2104
label = "battle menu"
display_enabled = true
ram = [{ addr = 0x800554D0, size = 4, value = 6 }, { addr = 0x800A3260, size = 2, value = 0, cmp = "gt" }]
margin_colors_min = 16
screenshot = true

# The battle menu is the fixture for widescreen_battle_4x3.toml.
[[check]]
at = 2118
label = "still drawing"
margin_colors_min = 16
screenshot = true

