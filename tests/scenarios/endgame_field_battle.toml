# The start of the battle is the fixture for battle_stable.toml.
[[savestate]]
at = 3570
path = "endgame_battle_start.state"

[[check]]
at = 3900
label = "battle menu"
display_enabled = true
screen_hash = "606f7e7f7707000379a671a4302f206f01a401a401a5f9e70000016401a40024"
ram = [{ addr = 0x800554D0, size = 4, value = 6 }, { addr = 0x800554D4, size = 4, value = 0x1FA }]
screenshot = true

# CROSS picks Fight, the target and the attack; tapping it wins and leads through the results back to the field.
[[wait]]
at = 3950
label = "battle won"
ram = [{ addr = 0x800554D0, size = 4, value = 20 }]
timeout = 6000
press = "CROSS"
every = 45
press_hold = 3

[[check]]
at = 4050
label = "victory"
display_enabled = true
screen_hash = "23ff00be001c00002fde239e27be27df21fe279e279e2ffe0000000000020100"
screenshot = true

[[wait]]
at = 4100
label = "back in the field"
ram = [{ addr = 0x800554D0, size = 4, value = 2 }, { addr = 0x800554D4, size = 4, value = 0x1FE }]
timeout = 3000
press = "CROSS"
every = 45
press_hold = 3

[[check]]
at = 4400
label = "field after the battle"
display_enabled = true
screen_hash = "fe00ff00fe00ff00e000f000f800e800cfd3bff06de3f180ffe0ffc0f7f0ff82"
