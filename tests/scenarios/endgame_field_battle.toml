name = "endgame_field_battle"
description = "From the late-game save walk around Amaterasu Central Sector until a random encounter starts and check the battle menu."
start_state = "endgame.state"   # written by endgame_state.toml
start_frame = 1300
frames = 4500
include = ["common/endgame_to_central.toml"]
memcard = "game:memcards/endgame.mcd"   # personal save data under the game directory; skipped when absent
skip_intro = false

# Game mode 0x800554D0: 2 field, 6 battle, 0x14 results. The battle arena is map 0x1FA (word 0x800554D4); 0x800A3260 is the
# first enemy's HP (half-word, see field_battle.toml).
#
# Encounters come after enough steps, and where they happen depends on the steps taken; the legs below wander
# along the street (CROSS is tapped throughout, like the walk this was recorded from) and the encounter starts in the
# last one.

